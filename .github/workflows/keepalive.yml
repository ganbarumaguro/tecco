name: Supabase Keepalive #　supabaseがフリーズするのを防ぐ

on:
  schedule:
    - cron: '0 3 */3 * *'  # 3日に1回、UTC 3:00(日本時間12:00)に実行
  workflow_dispatch:  # 手動実行もできるように

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/YOUR_TABLE_NAME?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
